                                    <div className="flex overflow-x-auto py-2 no-scrollbar gap-2 -mx-4 px-4 md:mx-0 md:px-0 md:flex-wrap w-screen md:w-auto">
                                        {availableYears.map(year => (
                                            <button key={year} onClick={() => setActiveYear(year)} className={`px-5 md:px-7 py-2 md:py-2.5 rounded-full border text-[10px] md:text-xs font-bold uppercase transition-all shrink-0 ${String(activeYear) === String(year) ? 'bg-zinc-900 text-white border-zinc-900 shadow-xl scale-105' : 'bg-transparent border-zinc-200 text-zinc-500 hover:border-zinc-400'}`}>{year === '全部' ? '全部年份' : `${year} 年`}</button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Waterfall Grid Gallery Items */}
                        <div className="gallery-columns space-y-4 md:space-y-8 text-left">
                            {!isLoaded && <div className="col-span-full py-24 text-center font-bold text-zinc-300 animate-pulse tracking-widest uppercase">正在同步 GitHub 画廊数据...</div>}
                            {isLoaded && displayProjects.map((project) => {
                                const currentIdx = previewIndices[project.id] || 0;
                                const images = (project.imgs && Array.isArray(project.imgs) && project.imgs.length > 0) ? project.imgs : [project.coverImage];
                                const displayImg = images[currentIdx];
                                const radius = config?.borderRadius ?? 16; 
                                const adjustedRadius = window.innerWidth < 640 ? Math.min(radius, 12) : radius;

                                return (
                                    <div key={project.id} style={{ borderRadius: `${adjustedRadius}px` }} className={`break-inside-avoid group relative bg-white border border-zinc-200/80 overflow-hidden transition-all duration-300 hover:shadow-2xl hover:border-zinc-300 shadow-sm flex flex-col text-left mb-4 md:mb-8 ${project.isHidden ? 'opacity-40 grayscale ring-2 ring-zinc-200' : 'opacity-100'}`}>
                                        {showAdminUI && (
                                            <div className="absolute top-3 right-3 flex gap-1.5 z-30 opacity-100 transition-all">
                                                <button title="置顶" onClick={() => setAsTop(project.id)} className="p-2 bg-white/90 backdrop-blur-md text-zinc-900 rounded-xl shadow-lg hover:scale-110 flex items-center justify-center border border-zinc-200"><Icon name="arrow-up-circle" size={14}/></button>
                                                <button title="编辑作品" onClick={() => handleStartEdit(project)} className="p-2 bg-white/90 backdrop-blur-md text-zinc-900 rounded-xl shadow-lg hover:scale-110 flex items-center justify-center border border-zinc-200"><Icon name="edit-3" size={14}/></button>
                                                <button title={project.isHidden ? "显示" : "隐藏"} onClick={() => toggleVisibility(project.id, project.isHidden)} className={`p-2 rounded-xl shadow-lg hover:scale-110 flex items-center justify-center border border-zinc-200 ${project.isHidden ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white/90 backdrop-blur-md text-zinc-900'}`}><Icon name={project.isHidden ? "eye-off" : "eye"} size={14}/></button>
                                                <button title="永久删除" onClick={() => handleDeleteProject(project.id)} className="p-2 bg-red-600 text-white rounded-xl shadow-lg hover:scale-110 flex items-center justify-center"><Icon name="trash-2" size={14}/></button>
                                            </div>
                                        )}

                                        {/* Main Media Block */}
                                        <div className="relative w-full overflow-hidden bg-zinc-50 border-b border-zinc-100">
                                            <MediaRenderer 
                                                videoUrl={project.videoUrl} 
                                                coverImg={displayImg} 
                                                watermarkText={config?.watermark} 
                                                alt={project.title} 
                                                className="w-full h-auto block" 
                                                onClick={() => setActiveLightbox({ open: true, project, index: currentIdx })}
                                            />
                                        </div>

                                        {/* Project Detail Metadata */}
                                        <div className="p-5 md:p-6 text-left flex-1 flex flex-col justify-between bg-white">
                                            <div>
                                                <div className="flex items-center justify-between gap-2 mb-2">
                                                    <span className="inline-block px-2.5 py-0.5 rounded-full bg-zinc-100 text-zinc-700 text-[10px] font-bold tracking-wide">
                                                        {project.type}
                                                    </span>
                                                    <span className="text-zinc-400 text-xs font-mono font-medium">{project.year}.{project.month}</span>
                                                </div>
                                                <h3 onClick={() => setActiveLightbox({ open: true, project, index: currentIdx })} className="text-base md:text-lg font-bold text-zinc-900 leading-snug line-clamp-2 cursor-pointer hover:text-zinc-600 transition-colors" style={{ color: config?.titleColor || '#18181b' }}>
                                                    {project.title}
                                                </h3>
                                                {project.description && (
                                                    <p className="text-xs text-zinc-500 font-normal leading-relaxed line-clamp-2 mt-2" style={{ color: config?.textColor || '#71717a' }}>
                                                        {project.description}
                                                    </p>
                                                )}
                                            </div>

                                            {/* Thumbnail Strip */}
                                            {images.length > 1 && (
                                                <div className="flex items-center gap-2 pt-4 mt-4 border-t border-zinc-100 overflow-x-auto no-scrollbar">
                                                    {images.map((img, idx) => (
                                                        <button 
                                                            key={idx} 
                                                            onClick={() => setPreviewIndices({ ...previewIndices, [project.id]: idx })} 
                                                            className={`w-10 h-10 md:w-12 md:h-12 rounded-xl overflow-hidden border-2 flex-shrink-0 transition-all ${currentIdx === idx ? 'border-zinc-900 scale-105 shadow-md' : 'border-zinc-100 opacity-50 hover:opacity-100'}`}
                                                        >
                                                            <img src={img} className="w-full h-full object-cover" />
                                                        </button>
                                                    ))}
                                                    <button 
                                                        onClick={() => setActiveLightbox({ open: true, project, index: currentIdx })} 
                                                        className="w-10 h-10 md:w-12 md:h-12 rounded-xl border border-dashed border-zinc-300 text-zinc-400 hover:text-zinc-900 hover:border-zinc-900 flex items-center justify-center shrink-0 text-xs font-bold transition-all"
                                                        title="全屏放大查看"
                                                    >
                                                        +{images.length}
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="py-24 px-10 border-t border-zinc-100 bg-white text-zinc-400 text-[9px] md:text-xs font-bold tracking-[0.3em] uppercase text-center">
                        <div>&copy; 2026 PORTFOLIO.LIVE — CREATIVE GALLERY</div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

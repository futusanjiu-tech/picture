                                                    </div>
                                                ))}
                                            </div>
                                            <form onSubmit={async (e)=>{
                                                e.preventDefault(); 
                                                if (!accessToken) return triggerToast("❌ 请先配置 GitHub Token！", "error");
                                                const n = e.target.newCat.value.trim(); 
                                                if (n) {
                                                    const nextCats = [...categories, { id: `c_${Date.now()}`, label: n, order: categories.length }];
                                                    try { 
                                                        await saveDataToGitHub(config, nextCats, projects); 
                                                        setCategories(nextCats); 
                                                        triggerToast("成功新增分类", "success"); 
                                                        e.target.newCat.value = ''; 
                                                    } catch (err) { 
                                                        triggerToast(`新增失败: ${err.message}`, "error"); 
                                                    }
                                                }
                                            }} className="flex gap-2">
                                                <input name="newCat" required placeholder="新分类名称..." className="flex-1 bg-white border border-zinc-200 rounded-xl px-4 py-2.5 text-xs outline-none focus:ring-1 ring-zinc-950/10" />
                                                <button type="submit" className="px-4 py-2.5 bg-zinc-950 text-white rounded-xl text-[10px] font-black uppercase shrink-0">添加</button>
                                            </form>
                                        </div>
                                    </div>
                                    
                                    {/* Content Upload & Form Panel */}
                                    <div className="lg:col-span-2 p-8 bg-zinc-50 rounded-3xl border border-zinc-200 shadow-sm">
                                        <h4 className="text-[10px] font-black uppercase text-zinc-400 mb-6 flex items-center gap-2">
                                            <Icon name={editingId ? "edit-3" : "plus"} size={14}/> {editingId ? '二次编辑作品信息' : '作品发布与上传中心'}
                                        </h4>
                                        
                                        <form onSubmit={handleUpload} className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                                            <div className="space-y-3">
                                                <input required value={form.title} onChange={e=>setForm({...form, title:e.target.value})} className="w-full bg-white border border-zinc-200 rounded-xl px-5 py-3 outline-none text-xs shadow-sm font-bold text-zinc-900" placeholder="作品标题名称" />
                                                <div className="flex gap-2">
                                                    <select value={form.type} onChange={e=>setForm({...form, type:e.target.value})} className="flex-1 bg-white border border-zinc-200 rounded-xl px-4 py-3 outline-none text-xs shadow-sm cursor-pointer font-medium">
                                                        {categories.map(c => <option key={c.id} value={c.label}>{c.label}</option>)}
                                                    </select>
                                                    <input type="number" value={form.year} onChange={e=>setForm({...form, year:e.target.value})} className="w-20 bg-white border border-zinc-200 rounded-xl px-2 outline-none text-xs text-center shadow-sm font-mono" />
                                                    <input type="number" value={form.month} onChange={e=>setForm({...form, month:e.target.value})} className="w-12 bg-white border border-zinc-200 rounded-xl px-2 outline-none text-xs text-center shadow-sm font-mono" />
                                                </div>
                                                <input value={form.videoUrl || ''} onChange={e=>setForm({...form, videoUrl:e.target.value})} className="w-full bg-white border border-zinc-200 rounded-xl px-5 py-3 outline-none text-xs shadow-sm font-mono" placeholder="动态视频链接 (MP4 / B站 iframe)" />
                                                <textarea value={form.description} onChange={e=>setForm({...form, description:e.target.value})} className="w-full bg-white border border-zinc-200 rounded-xl px-5 py-4 outline-none text-xs h-28 shadow-sm leading-relaxed" placeholder="作品简述与创作背景..." />
                                            </div>
                                            
                                            <div className="space-y-4 flex flex-col justify-between">
                                                {/* Local File Dropzone */}
                                                <div 
                                                    onDragOver={(e) => { e.preventDefault(); setIsDragOver(true); }}
                                                    onDragLeave={() => setIsDragOver(false)}
                                                    onDrop={handleFileDrop}
                                                    onClick={() => localProjectFileInputRef.current.click()}
                                                    className={`border-2 border-dashed rounded-2xl p-4 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-2 ${isDragOver ? 'drag-active' : 'border-zinc-200 hover:border-zinc-400 bg-white'}`}
                                                >
                                                    <div className="w-10 h-10 bg-zinc-100 rounded-full flex items-center justify-center text-zinc-600">
                                                        <Icon name="upload" size={18} />
                                                    </div>
                                                    <div>
                                                        <p className="text-xs font-bold text-zinc-700">点击选择本地图片 或 将图片拖拽至此</p>
                                                        <p className="text-[9px] text-zinc-400 font-medium">支持多图选中（自动高保真压缩）</p>
                                                    </div>
                                                    <input 
                                                        type="file" 
                                                        ref={localProjectFileInputRef} 
                                                        onChange={(e) => handleLocalFiles(e.target.files)} 
                                                        multiple 
                                                        accept="image/*" 
                                                        className="hidden" 
                                                    />
                                                </div>

                                                {/* Selected Local Images Preview */}
                                                {form.images.length > 0 && (
                                                    <div className="space-y-1">
                                                        <span className="text-[9px] font-black text-zinc-400 uppercase">已选择图片 ({form.images.length})：</span>
                                                        <div className="flex gap-2 overflow-x-auto py-2 no-scrollbar">
                                                            {form.images.map((imgSrc, idx) => (
                                                                <div key={idx} className="relative group shrink-0 w-14 h-14 rounded-xl overflow-hidden border border-zinc-200 shadow-sm">
                                                                    <img src={imgSrc} className="w-full h-full object-cover" />
                                                                    <button 
                                                                        type="button" 
                                                                        onClick={(e) => { e.stopPropagation(); handleRemoveImageIndex(idx); }}
                                                                        className="absolute inset-0 bg-red-600/80 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                                                                    >
                                                                        <Icon name="x" size={12} />
                                                                    </button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {/* Optional Cloud Link Input */}
                                                <div className="relative">
                                                    <div className="absolute top-3 left-4 text-zinc-300 pointer-events-none"><Icon name="link" size={14}/></div>
                                                    <textarea 
                                                        value={form.imageUrlsText || ''} 
                                                        onChange={e=>setForm({...form, imageUrlsText:e.target.value})} 
                                                        className="w-full bg-white border border-zinc-200 rounded-2xl pl-10 pr-4 py-3 outline-none text-[11px] h-20 shadow-sm font-mono whitespace-pre placeholder:text-zinc-300" 
                                                        placeholder="或粘贴网络图片/COS链接 (换行分隔多张)..."
                                                    />
                                                </div>

                                                <button disabled={isSyncing || isProcessingFiles} type="submit" className="w-full py-4 bg-zinc-950 text-white rounded-xl font-black shadow-lg text-xs uppercase tracking-widest active:scale-95 transition-all disabled:opacity-50">
                                                    {isProcessingFiles ? "正在处理本地文件..." : isSyncing ? "正在写入 GitHub 云端..." : editingId ? "保存并修改云端数据" : "确认发布作品并存入云端"}
                                                </button>
                                                {editingId && (
                                                    <button type="button" onClick={handleCancelEdit} className="w-full py-2 border border-zinc-200 text-zinc-400 font-bold rounded-xl text-[10px]">取消编辑</button>
                                                )}
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {/* Gallery Header Banner */}
                        <div className="mb-8 md:mb-14 text-left animate-in fade-in duration-1000">
                            {(config?.showBanner !== false) && (() => {
                                const headerImgs = (config?.header?.headerImages && config.header.headerImages.length > 0) 
                                    ? config.header.headerImages 
                                    : (config?.header?.headerImage ? [config.header.headerImage] : []);
                                
                                if (headerImgs.length === 0) return null;

                                const currentHeaderImg = headerImgs[activeHeaderImgIdx] || headerImgs[0];
                                const bannerH = config?.bannerHeight ?? 280;

                                return (
                                    <div className="w-full mb-6 md:mb-10 rounded-3xl overflow-hidden shadow-xl border border-zinc-100 bg-zinc-900 relative group transition-all duration-300">
                                        <div 
                                            style={{ height: `${bannerH}px` }}
                                            className="w-full cursor-pointer relative"
                                            onClick={() => setActiveLightbox({ open: true, project: { title: config?.header?.title || '个人介绍', type: 'INTRO', year: 'PRO', month: 'FOLIO', imgs: headerImgs }, index: activeHeaderImgIdx })}
                                        >
                                            <WatermarkedDisplay src={currentHeaderImg} watermarkText={config?.watermark} watermarkFontSize={config?.watermarkFontSize || 24} alt="Header Banner" className="w-full h-full object-cover" />
                                        </div>

                                        {headerImgs.length > 1 && (
                                            <>
                                                <button 
                                                    onClick={() => setActiveHeaderImgIdx(prev => (prev - 1 + headerImgs.length) % headerImgs.length)} 
                                                    className="absolute left-4 top-1/2 -translate-y-1/2 p-3 bg-black/40 hover:bg-black/80 rounded-full text-white backdrop-blur-md transition-all opacity-0 group-hover:opacity-100"
                                                >
                                                    ‹
                                                </button>
                                                <button 
                                                    onClick={() => setActiveHeaderImgIdx(prev => (prev + 1) % headerImgs.length)} 
                                                    className="absolute right-4 top-1/2 -translate-y-1/2 p-3 bg-black/40 hover:bg-black/80 rounded-full text-white backdrop-blur-md transition-all opacity-0 group-hover:opacity-100"
                                                >
                                                    ›
                                                </button>

                                                <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 p-2 bg-black/50 backdrop-blur-md rounded-full">
                                                    {headerImgs.map((img, idx) => (
                                                        <button 
                                                            key={idx} 
                                                            onClick={() => setActiveHeaderImgIdx(idx)} 
                                                            className={`w-2.5 h-2.5 rounded-full transition-all ${activeHeaderImgIdx === idx ? 'bg-white scale-125' : 'bg-white/40 hover:bg-white/80'}`}
                                                        />
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </div>
                                );
                            })()}

                            <h1 
                                style={{ fontSize: `${config?.titleSize ?? 64}px`, lineHeight: 1.05 }}
                                className="font-black tracking-tighter mb-6 md:mb-10 text-zinc-900 text-left transition-all duration-300"
                            >
                                {config?.header?.subtitle || 'MY WORK'}<br/><span className="text-zinc-200">{config?.header?.title || 'PORTFOLIO'}</span>
                            </h1>

                            <div className="flex flex-wrap items-center justify-between gap-4 mb-8 pt-6 border-t border-zinc-100">
                                <div className="flex flex-wrap items-center gap-2">
                                    {categories.map(cat => (
                                        <button
                                            key={cat.id}
                                            onClick={() => setActiveCategory(cat.label)}
                                            className={`px-4 py-2 rounded-full text-xs font-bold transition-all ${activeCategory === cat.label ? 'bg-zinc-950 text-white shadow-md scale-105' : 'bg-zinc-100 text-zinc-600 hover:bg-zinc-200'}`}
                                        >
                                            {cat.label}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-xs text-zinc-400 font-medium">年份筛选：</span>
                                    <select
                                        value={activeYear}
                                        onChange={(e) => setActiveYear(e.target.value)}
                                        className="bg-zinc-100 text-zinc-800 text-xs font-bold px-3 py-2 rounded-full border-none outline-none cursor-pointer"
                                    >
                                        {availableYears.map(yr => (
                                            <option key={yr} value={yr}>{yr}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {}
                        {/* Gallery Grid */}
                        <div className="gallery-columns">
                            {displayProjects.map((project) => (
                                <ProjectCard
                                    key={project.id}
                                    project={project}
                                    isAdminMode={isAdminMode}
                                    showAdminUI={showAdminUI}
                                    config={config}
                                    onSetAsTop={setAsTop}
                                    onToggleVisibility={toggleVisibility}
                                    onStartEdit={handleStartEdit}
                                    onDelete={handleDeleteProject}
                                    onOpenLightbox={(proj, idx) => setActiveLightbox({ open: true, project: proj, index: idx })}
                                />
                            ))}
                        </div>

                        {displayProjects.length === 0 && (
                            <div className="py-20 text-center text-zinc-400 bg-zinc-50 rounded-3xl border border-dashed border-zinc-200">
                                <Icon name="image" size={36} className="mx-auto mb-3 opacity-40" />
                                <p className="text-sm font-bold">暂无相关作品</p>
                                <p className="text-xs mt-1 text-zinc-400">请尝试选择其他分类或在管理后台发布新作品</p>
                            </div>
                        )}
                    </main>

                    {}
                    {/* Lightbox Modal */}
                    {activeLightbox.open && (
                        <LightboxModal
                            project={activeLightbox.project}
                            initialIndex={activeLightbox.index}
                            watermark={config?.watermark}
                            watermarkFontSize={config?.watermarkFontSize}
                            onClose={() => setActiveLightbox({ open: false, project: null, index: 0 })}
                        />
                    )}

                    {/* Share Modal */}
                    {shareModal && (
                        <div className="fixed inset-0 z-[3000] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl space-y-6 text-left animate-in zoom-in-95 duration-150">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-black text-zinc-900">分享画廊地址</h3>
                                    <button onClick={() => setShareModal(false)} className="p-2 hover:bg-zinc-100 rounded-full text-zinc-400 hover:text-zinc-900">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>
                                <p className="text-xs text-zinc-500 leading-relaxed">生成访客只读链接（访客无法查看或修改你的 GitHub Token）。</p>
                                <div className="space-y-3">
                                    <button onClick={() => handleCopyShareLink(0)} className="w-full py-3.5 bg-zinc-950 text-white rounded-2xl font-bold text-xs shadow-md hover:bg-zinc-800 transition-colors flex items-center justify-center gap-2">
                                        <Icon name="share-2" size={14} /> 复制永久公开链接
                                    </button>
                                    <button onClick={() => handleCopyShareLink(7)} className="w-full py-3.5 bg-zinc-100 text-zinc-800 rounded-2xl font-bold text-xs hover:bg-zinc-200 transition-colors flex items-center justify-center gap-2">
                                        <Icon name="clock" size={14} /> 复制 7 天有效临时链接
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Confirm Modal */}
                    {confirmModal.show && (
                        <div className="fixed inset-0 z-[3000] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl space-y-6 text-center animate-in zoom-in-95 duration-150">
                                <div className="w-12 h-12 bg-red-100 text-red-500 rounded-2xl flex items-center justify-center mx-auto">
                                    <Icon name="alert-circle" size={24} />
                                </div>
                                <h3 className="text-base font-black text-zinc-900 leading-snug">{confirmModal.title}</h3>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmModal({ show: false, title: '', onConfirm: null })} className="flex-1 py-3 bg-zinc-100 text-zinc-700 font-bold text-xs rounded-xl hover:bg-zinc-200 transition-colors">
                                        取消
                                    </button>
                                    <button onClick={() => { const fn = confirmModal.onConfirm; setConfirmModal({ show: false, title: '', onConfirm: null }); if(fn) fn(); }} className="flex-1 py-3 bg-red-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-red-700 transition-colors">
                                        确认操作
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`fixed bottom-6 right-6 z-[4000] px-5 py-3.5 rounded-2xl text-xs font-bold shadow-2xl flex items-center gap-2.5 animate-in slide-in-from-bottom-5 duration-200 ${
                            toast.type === 'error' ? 'bg-red-900 text-red-100 border border-red-700' :
                            toast.type === 'success' ? 'bg-zinc-900 text-white border border-zinc-700' :
                            toast.type === 'warning' ? 'bg-amber-900 text-amber-100 border border-amber-700' :
                            'bg-zinc-900 text-white'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert-circle' : toast.type === 'success' ? 'check-circle' : 'alert-circle'} size={16} />
                            <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

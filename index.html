<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO.FOLIO - 极速稳定画廊</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PRO.FOLIO">
    <link rel="apple-touch-icon" href="https://img.icons8.com/?size=512&id=118557&format=png">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">

    <!-- Tailwind CSS & React UMD Scripts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .transition-all-fast { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .max-w-gallery { max-width: 1900px; margin-left: auto; margin-right: auto; }
        
        .gallery-columns { column-gap: 0.75rem; column-count: 2; }
        @media (min-width: 768px) { .gallery-columns { column-count: 3; column-gap: 1.5rem; } }
        @media (min-width: 1024px) { .gallery-columns { column-count: 4; } }
        @media (min-width: 1280px) { .gallery-columns { column-count: 5; } }
        
        .break-inside-avoid { break-inside: avoid; -webkit-column-break-inside: avoid; }
        body { padding-bottom: env(safe-area-inset-bottom); }
        
        .drag-active {
            border-color: #18181b !important;
            background-color: #f4f4f5 !important;
        }
    </style>
</head>
<body class="bg-white selection:bg-zinc-900 selection:text-white text-zinc-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const LOCAL_FALLBACK_CATEGORIES = [
            { id: 'All', label: '全部', order: 0 },
            { id: 'c_1', label: '3D作品', order: 1 },
            { id: 'c_2', label: '动态视频', order: 2 }
        ];

        const LOCAL_FALLBACK_CONFIG = {
            header: { title: 'MY CREATIVE WORK', subtitle: 'PRO.PORTFOLIO', headerImage: '', headerImages: [] },
            watermark: '© COPY PROTECTION',
            watermarkFontSize: 24,
            borderRadius: 16,
            titleColor: '#18181b',
            textColor: '#71717a',
            bannerHeight: 280,
            cardMaxHeight: 480,
            showBanner: true,
            titleSize: 64
        };

        const LOCAL_FALLBACK_PROJECTS = [
            {
                id: 'local_demo',
                title: '明星年终送礼清单',
                description: '这是一个演示项目。长图与标准图现已完美适配垂直滚动与云端卡片预览。',
                type: 'H5长图',
                year: 2025,
                month: 12,
                videoUrl: '',
                coverImage: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1800" viewBox="0 0 800 1800"><rect width="800" height="1800" fill="%23f4f4f5"/><text x="50%25" y="10%25" font-family="sans-serif" font-weight="bold" font-size="28" fill="%23a1a1aa" text-anchor="middle">H5长图顶部 (支持上下滚动)</text><text x="50%25" y="50%25" font-family="sans-serif" font-weight="bold" font-size="28" fill="%23a1a1aa" text-anchor="middle">长图中部内容</text><text x="50%25" y="90%25" font-family="sans-serif" font-weight="bold" font-size="28" fill="%23a1a1aa" text-anchor="middle">长图底部内容</text></svg>',
                imgs: []
            }
        ];

        const Icon = ({ name, size = 18, className = "" }) => {
            const svgProps = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", className: `inline-flex align-middle select-none ${className}` };
            switch (name) {
                case 'x': return <svg {...svgProps}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
                case 'edit-3': return <svg {...svgProps}><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>;
                case 'trash-2': return <svg {...svgProps}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
                case 'arrow-up-circle': return <svg {...svgProps}><circle cx="12" cy="12" r="10"></circle><polyline points="16 12 12 8 8 12"></polyline><line x1="12" y1="16" x2="12" y2="8"></line></svg>;
                case 'eye': return <svg {...svgProps}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>;
                case 'eye-off': return <svg {...svgProps}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.49 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>;
                case 'upload': return <svg {...svgProps}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
                case 'image': return <svg {...svgProps}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
                case 'layers': return <svg {...svgProps}><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polygon points="2 17 12 22 22 17"></polygon><polygon points="2 12 12 17 22 12"></polygon></svg>;
                case 'tag': return <svg {...svgProps}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>;
                case 'calendar': return <svg {...svgProps}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
                case 'clock': return <svg {...svgProps}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
                case 'share-2': return <svg {...svgProps}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>;
                case 'layout': return <svg {...svgProps}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>;
                case 'plus': return <svg {...svgProps}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
                case 'link': return <svg {...svgProps}><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
                case 'alert-circle': return <svg {...svgProps}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
                case 'check-circle': return <svg {...svgProps}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
                default: return null;
            }
        };

        const WatermarkedDisplay = ({ src, watermarkText, watermarkFontSize = 24, alt, className }) => {
            return (
                <div className="relative inline-block w-full h-full select-none">
                    <img src={src} alt={alt} loading="lazy" className={`${className} block w-full h-auto`} />
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden">
                        <span style={{ fontSize: `${watermarkFontSize}px` }} className="text-white/35 font-bold rotate-[-15deg] whitespace-nowrap leading-none">
                            {watermarkText || "PORTFOLIO"}
                        </span>
                    </div>
                </div>
            );
        };

        const MediaRenderer = ({ videoUrl, coverImg, watermarkText, watermarkFontSize, cardMaxHeight = 480, alt, className, onClick }) => {
            if (videoUrl && videoUrl.trim() !== '') {
                if (videoUrl.includes('<iframe') || videoUrl.includes('player.bilibili.com') || videoUrl.includes('iframe')) {
                    let src = videoUrl;
                    if (videoUrl.includes('<iframe')) {
                        const match = videoUrl.match(/src="([^"]+)"/);
                        if (match) src = match[1];
                    }
                    if (src.startsWith('//')) src = 'https:' + src;
                    return (
                        <div className="aspect-video w-full rounded-t-2xl overflow-hidden bg-black">
                            <iframe src={src} scrolling="no" frameBorder="0" allowFullScreen={true} className="w-full h-full"></iframe>
                        </div>
                    );
                } else {
                    return (
                        <video src={videoUrl} autoPlay loop muted playsInline controls className="w-full h-auto block bg-black rounded-t-2xl max-h-[75vh]"></video>
                    );
                }
            }
            return (
                <div className="cursor-pointer group relative overflow-hidden rounded-t-2xl">
                    <div 
                        onClick={onClick} 
                        style={{ maxHeight: `${cardMaxHeight}px` }}
                        className="overflow-y-auto no-scrollbar relative"
                    >
                        <WatermarkedDisplay src={coverImg} watermarkText={watermarkText} watermarkFontSize={watermarkFontSize} alt={alt} className={`${className} group-hover:scale-[1.01] transition-transform duration-500`} />
                    </div>
                    {/* 固定底部的白色半透明玻璃质感提示条 */}
                    <div className="absolute bottom-3 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none z-10">
                        <span className="bg-white/80 text-zinc-900 text-[11px] font-bold px-3.5 py-1.5 rounded-full shadow-lg backdrop-blur-md border border-white/60 flex items-center gap-1.5 whitespace-nowrap">
                            <Icon name="eye" size={13} className="text-zinc-700" /> 点击放大 / 滚动查看长图
                        </span>
                    </div>
                </div>
            );
        };

        const ProjectCard = ({ project, isAdminMode, showAdminUI, config, onSetAsTop, onToggleVisibility, onStartEdit, onDelete, onOpenLightbox }) => {
            const [selectedImgIdx, setSelectedImgIdx] = useState(0);
            const thumbRefs = useRef([]);
            const images = (project.imgs && project.imgs.length > 0) ? project.imgs : [project.coverImage || ''];
            const currentImg = images[selectedImgIdx] || project.coverImage;
            const monthStr = String(project.month || 1).padStart(2, '0');

            useEffect(() => {
                if (thumbRefs.current[selectedImgIdx]) {
                    thumbRefs.current[selectedImgIdx].scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'center'
                    });
                }
            }, [selectedImgIdx]);

            return (
                <div className="break-inside-avoid mb-6 bg-white rounded-3xl border border-zinc-100 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden group text-left relative">
                    {project.isHidden && (
                        <div className="absolute top-3 left-3 z-20 bg-amber-500/90 backdrop-blur-md text-white text-[10px] font-black px-2.5 py-1 rounded-full flex items-center gap-1 shadow-md">
                            <Icon name="eye-off" size={12} /> 隐藏中
                        </div>
                    )}

                    {/* Top Media Area with Floating Action Icons */}
                    <div className="relative">
                        <MediaRenderer
                            videoUrl={project.videoUrl}
                            coverImg={currentImg}
                            watermarkText={config?.watermark}
                            watermarkFontSize={config?.watermarkFontSize || 24}
                            cardMaxHeight={config?.cardMaxHeight ?? 480}
                            alt={project.title}
                            onClick={() => onOpenLightbox(project, selectedImgIdx)}
                        />

                        {/* Top-Right Floating Controls (Matching exact design in reference image) */}
                        {isAdminMode && showAdminUI && (
                            <div className="absolute top-3 right-3 z-30 flex items-center gap-1.5 bg-white/40 backdrop-blur-md p-1 rounded-full shadow-lg border border-white/40">
                                <button onClick={() => onSetAsTop(project.id)} title="置顶" className="w-8 h-8 rounded-full bg-white text-zinc-700 hover:bg-zinc-100 flex items-center justify-center shadow-sm transition-transform active:scale-95">
                                    <Icon name="arrow-up-circle" size={16} />
                                </button>
                                <button onClick={() => onStartEdit(project)} title="编辑" className="w-8 h-8 rounded-full bg-white text-zinc-700 hover:bg-zinc-100 flex items-center justify-center shadow-sm transition-transform active:scale-95">
                                    <Icon name="edit-3" size={16} />
                                </button>
                                <button onClick={() => onToggleVisibility(project.id, project.isHidden)} title={project.isHidden ? "显示" : "隐藏"} className="w-8 h-8 rounded-full bg-white text-zinc-700 hover:bg-zinc-100 flex items-center justify-center shadow-sm transition-transform active:scale-95">
                                    <Icon name={project.isHidden ? "eye" : "eye-off"} size={16} />
                                </button>
                                <button onClick={() => onDelete(project.id)} title="删除" className="w-8 h-8 rounded-full bg-red-500 text-white hover:bg-red-600 flex items-center justify-center shadow-sm transition-transform active:scale-95">
                                    <Icon name="trash-2" size={16} />
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Bottom Details Section */}
                    <div className="p-4 md:p-5 space-y-2">
                        <div className="flex items-center justify-between gap-2">
                            <span className="px-3 py-1 bg-zinc-100 text-zinc-700 rounded-full text-xs font-bold tracking-wide">
                                {project.type}
                            </span>
                            <span className="text-xs font-semibold text-zinc-400 font-mono">
                                {project.year}.{monthStr}
                            </span>
                        </div>
                        
                        <h3 className="text-base md:text-lg font-black text-zinc-900 leading-snug pt-1">{project.title}</h3>
                        {project.description && (
                            <p className="text-xs text-zinc-500 line-clamp-2 leading-relaxed">{project.description}</p>
                        )}

                        {/* Sub-images Thumbnails Row */}
                        {images.length > 0 && (
                            <div className="pt-2">
                                <div className="relative group/thumbs">
                                    <div className="flex items-center gap-2.5 overflow-x-auto no-scrollbar py-2 px-1 scroll-smooth">
                                        {images.map((imgUrl, idx) => (
                                            <button
                                                key={idx}
                                                ref={el => thumbRefs.current[idx] = el}
                                                onClick={() => setSelectedImgIdx(idx)}
                                                className={`relative shrink-0 w-12 h-12 md:w-14 md:h-14 rounded-2xl overflow-hidden transition-all duration-300 ${
                                                    selectedImgIdx === idx 
                                                        ? 'ring-2 ring-white/80 scale-105 shadow-md opacity-100' 
                                                        : 'opacity-50 hover:opacity-100 scale-95 border border-zinc-200/60'
                                                }`}
                                            >
                                                <img src={imgUrl} className="w-full h-full object-cover" alt="" />
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const LightboxModal = ({ project, initialIndex = 0, watermark, watermarkFontSize, onClose }) => {
            if (!project) return null;
            const images = (project.imgs && project.imgs.length > 0) ? project.imgs : [project.coverImage];
            const [currentIndex, setCurrentIndex] = useState(initialIndex);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') onClose();
                    if (e.key === 'ArrowRight') setCurrentIndex(prev => (prev + 1) % images.length);
                    if (e.key === 'ArrowLeft') setCurrentIndex(prev => (prev - 1 + images.length) % images.length);
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [images.length, onClose]);

            return (
                <div className="fixed inset-0 z-[2000] bg-black/90 backdrop-blur-2xl flex flex-col justify-between p-4 md:p-8 text-white select-none animate-in fade-in duration-200">
                    <div className="flex justify-between items-center z-10 max-w-7xl w-full mx-auto">
                        <div>
                            <h3 className="text-base md:text-2xl font-black text-white">{project.title}</h3>
                            <p className="text-xs text-zinc-400 font-medium mt-0.5">{project.type} • {project.year}.{project.month} {images.length > 1 && `(${currentIndex + 1}/${images.length})`}</p>
                        </div>
                        <button onClick={onClose} className="p-3 bg-white/10 hover:bg-white/20 rounded-full text-white transition-all hover:scale-110">
                            <Icon name="x" size={20} />
                        </button>
                    </div>

                    <div className="relative flex-1 flex items-center justify-center my-4 overflow-hidden max-w-7xl w-full mx-auto">
                        {images.length > 1 && (
                            <button onClick={() => setCurrentIndex(prev => (prev - 1 + images.length) % images.length)} className="absolute left-2 md:left-6 z-20 p-3 md:p-4 bg-black/40 hover:bg-black/80 rounded-full text-white backdrop-blur-md transition-all">
                                ‹
                            </button>
                        )}
                        
                        <div className="w-full max-h-[82vh] overflow-y-auto no-scrollbar flex flex-col items-center justify-start py-2">
                            {project.videoUrl ? (
                                <MediaRenderer videoUrl={project.videoUrl} coverImg={images[currentIndex]} watermarkText={watermark} watermarkFontSize={watermarkFontSize} alt={project.title} className="max-h-[75vh] w-auto rounded-2xl object-contain" />
                            ) : (
                                <WatermarkedDisplay src={images[currentIndex]} watermarkText={watermark} watermarkFontSize={watermarkFontSize} alt={project.title} className="w-auto max-w-full rounded-2xl object-contain shadow-2xl" />
                            )}
                        </div>

                        {images.length > 1 && (
                            <button onClick={() => setCurrentIndex(prev => (prev + 1) % images.length)} className="absolute right-2 md:right-6 z-20 p-3 md:p-4 bg-black/40 hover:bg-black/80 rounded-full text-white backdrop-blur-md transition-all">
                                ›
                            </button>
                        )}
                    </div>

                    {images.length > 1 && (
                        <div className="flex justify-center gap-2.5 overflow-x-auto py-2 no-scrollbar z-10 max-w-3xl mx-auto">
                            {images.map((img, idx) => (
                                <button key={idx} onClick={() => setCurrentIndex(idx)} className={`w-12 h-12 md:w-16 md:h-16 rounded-xl overflow-hidden border-2 transition-all ${currentIndex === idx ? 'border-white scale-110 shadow-xl' : 'border-transparent opacity-40 hover:opacity-80'}`}>
                                    <img src={img} className="w-full h-full object-cover" />
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const b64EncodeUnicode = (str) => {
            try {
                const bytes = new TextEncoder().encode(str);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) { 
                    binary += String.fromCharCode(bytes[i]); 
                }
                return btoa(binary);
            } catch (err) {
                return btoa(unescape(encodeURIComponent(str)));
            }
        };

        const b64DecodeUnicode = (str) => {
            try {
                const cleaned = (str || '').replace(/\s/g, '');
                const binary = atob(cleaned);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) { 
                    bytes[i] = binary.charCodeAt(i); 
                }
                return new TextDecoder().decode(bytes);
            } catch (err) {
                try {
                    return decodeURIComponent(escape(atob((str || '').replace(/\s/g, ''))));
                } catch (e) {
                    return '';
                }
            }
        };

        const readFileAsDataURL = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (err) => reject(err);
                reader.readAsDataURL(file);
            });
        };

        const processImageSafe = async (base64Str, maxWidth = 900, quality = 0.6) => {
            const perform = (src, w, q) => new Promise(res => {
                const img = new Image(); 
                img.src = src;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > w) { 
                        height = (w / width) * height; 
                        width = w; 
                    }
                    canvas.width = width; 
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true; 
                    ctx.imageSmoothingQuality = "high";
                    ctx.drawImage(img, 0, 0, width, height); 
                    res(canvas.toDataURL('image/jpeg', q));
                };
                img.onerror = () => res(src);
            });
            let result = await perform(base64Str, maxWidth, quality);
            while (result.length > 150000 && maxWidth > 300) {
                maxWidth = Math.floor(maxWidth * 0.75); 
                quality = Math.max(0.3, quality - 0.1); 
                result = await perform(base64Str, maxWidth, quality);
            }
            return result;
        };

        const App = () => {
            const [owner, setOwner] = useState('');
            const [repo, setRepo] = useState('');
            const [branch, setBranch] = useState('main');
            const [path, setPath] = useState('db.json');
            const [accessToken, setAccessToken] = useState('');
            const [fileSha, setFileSha] = useState(''); 
            
            const [loginOwner, setLoginOwner] = useState('');
            const [loginRepo, setLoginRepo] = useState('');
            const [loginBranch, setLoginBranch] = useState('main');
            const [loginToken, setLoginToken] = useState('');

            const [isLoaded, setIsLoaded] = useState(false);
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [showAdminUI, setShowAdminUI] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isProcessingFiles, setIsProcessingFiles] = useState(false);
            const [isExpired, setIsExpired] = useState(false); 
            const [isDragOver, setIsDragOver] = useState(false);

            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', onConfirm: null });
            const [shareModal, setShareModal] = useState(false); 
            const [activeLightbox, setActiveLightbox] = useState({ open: false, project: null, index: 0 });

            const [config, setConfig] = useState(LOCAL_FALLBACK_CONFIG);
            const [categories, setCategories] = useState(LOCAL_FALLBACK_CATEGORIES);
            const [projects, setProjects] = useState(LOCAL_FALLBACK_PROJECTS);
            const [activeCategory, setActiveCategory] = useState('全部');
            const [activeYear, setActiveYear] = useState('全部');

            const [editingId, setEditingId] = useState(null);
            const [form, setForm] = useState({ 
                title: '', 
                description: '', 
                type: '全部', 
                year: new Date().getFullYear(), 
                month: new Date().getMonth() + 1, 
                imageUrlsText: '', 
                images: [],
                videoUrl: '' 
            });
            
            const [activeHeaderImgIdx, setActiveHeaderImgIdx] = useState(0);
            const headerFileInputRef = useRef(null);
            const localProjectFileInputRef = useRef(null);

            const triggerToast = (msg, type = "info") => {
                setToast({ show: true, message: msg, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
            };

            const triggerConfirm = (title, onConfirm) => { 
                setConfirmModal({ show: true, title, onConfirm }); 
            };

            const handleCopyToken = async () => {
                try {
                    await navigator.clipboard.writeText(accessToken);
                    triggerToast("访问令牌已复制至剪贴板", "success");
                } catch (err) {
                    triggerToast("复制失败，请手动复制", "error");
                }
            };

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const urlOwner = params.get('owner'); 
                const urlRepo = params.get('repo'); 
                const urlBranch = params.get('branch') || 'main'; 
                const urlExpire = params.get('expire'); 
                const urlAdmin = params.get('admin');

                if (urlExpire) {
                    if (Date.now() > parseInt(urlExpire, 10)) {
                        setIsExpired(true);
                        if (localStorage.getItem('gh_portfolio_token')) { 
                            setAccessToken(localStorage.getItem('gh_portfolio_token')); 
                        }
                        return; 
                    }
                }

                const cachedOwner = localStorage.getItem('gh_portfolio_owner') || '';
                const cachedRepo = localStorage.getItem('gh_portfolio_repo') || '';
                const cachedToken = localStorage.getItem('gh_portfolio_token') || '';

                if (cachedToken || urlAdmin === '1' || urlAdmin === 'true') { 
                    setIsAdminMode(true); 
                    if (cachedToken) {
                        setAccessToken(cachedToken); 
                        setShowAdminUI(true); 
                    }
                }

                const effectiveOwner = urlOwner || cachedOwner;
                const effectiveRepo = urlRepo || cachedRepo;
                const effectiveBranch = urlBranch;

                setLoginOwner(effectiveOwner);
                setLoginRepo(effectiveRepo);
                setLoginBranch(effectiveBranch);
                setLoginToken(cachedToken);

                if (effectiveOwner && effectiveRepo) {
                    setOwner(effectiveOwner); 
                    setRepo(effectiveRepo); 
                    setBranch(effectiveBranch);
                    localStorage.setItem('gh_portfolio_owner', effectiveOwner); 
                    localStorage.setItem('gh_portfolio_repo', effectiveRepo);
                    loadDataFromGitHub(effectiveOwner, effectiveRepo, effectiveBranch, cachedToken);
                } else {
                    setIsLoaded(true);
                }
            }, []);

            const fetchShaOnly = async (own, rep, br, tok) => {
                try {
                    const headers = tok ? { 'Authorization': `Bearer ${tok.trim()}`, 'Accept': 'application/vnd.github.v3+json' } : {};
                    const res = await fetch(`https://api.github.com/repos/${own}/${rep}/contents/${path}?ref=${br}&t=${Date.now()}`, { headers });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.sha) { 
                            setFileSha(data.sha); 
                            localStorage.setItem('github_file_sha', data.sha); 
                        }
                    }
                } catch(e) {}
            };

            const loadDataFromGitHub = async (own, rep, br, tok) => {
                const useApiFirst = !!tok;
                const cacheBuster = `${Date.now()}_${Math.random()}`;
                const apiUrl = `https://api.github.com/repos/${own}/${rep}/contents/${path}?ref=${br}&t=${cacheBuster}`;
                const rawUrl = `https://raw.githubusercontent.com/${own}/${rep}/${br}/${path}?t=${cacheBuster}`;
                const tokenHeaders = tok ? { 'Authorization': `Bearer ${tok.trim()}`, 'Accept': 'application/vnd.github.v3+json' } : {};

                if (useApiFirst) {
                    try {
                        const res = await fetch(apiUrl, { headers: tokenHeaders });
                        if (!res.ok) {
                            if (res.status === 404) {
                                setProjects(LOCAL_FALLBACK_PROJECTS); 
                                setCategories(LOCAL_FALLBACK_CATEGORIES); 
                                setConfig(LOCAL_FALLBACK_CONFIG); 
                                setFileSha(''); 
                                localStorage.removeItem('github_file_sha');
                                triggerToast("仓库连接成功！目前为全新空间。", "success");
                                setIsLoaded(true); 
                                return;
                            }
                            throw new Error(`GitHub 接口状态异常: ${res.status}`);
                        }
                        const apiData = await res.json();
                        if (apiData.sha) { 
                            setFileSha(apiData.sha); 
                            localStorage.setItem('github_file_sha', apiData.sha); 
                        }
                        applyLoadedData(JSON.parse(b64DecodeUnicode(apiData.content)));
                        setIsLoaded(true); 
                        return;
                    } catch(e) {
                        try {
                            const resRaw = await fetch(rawUrl);
                            if (resRaw.status === 404) {
                                setProjects(LOCAL_FALLBACK_PROJECTS); 
                                setCategories(LOCAL_FALLBACK_CATEGORIES); 
                                setConfig(LOCAL_FALLBACK_CONFIG); 
                                setFileSha('');
                                setIsLoaded(true); 
                                return;
                            }
                            if (!resRaw.ok) throw new Error(`Raw直连失败`);
                            applyLoadedData(await resRaw.json()); 
                            fetchShaOnly(own, rep, br, tok); 
                            setIsLoaded(true); 
                            return;
                        } catch(rawErr) { 
                            triggerToast(`获取数据失败，请检查 Token 权限或仓库设置。`, "error"); 
                        }
                    }
                }

                try {
                    const res = await fetch(apiUrl, { headers: tokenHeaders });
                    if (res.ok) {
                        const apiData = await res.json();
                        if (apiData.sha) {
                            setFileSha(apiData.sha);
                        }
                        applyLoadedData(JSON.parse(b64DecodeUnicode(apiData.content))); 
                        setIsLoaded(true); 
                        return;
                    }
                } catch(e) { 
                    triggerToast("已进入展示视图", "info"); 
                } finally { 
                    setIsLoaded(true); 
                }
            };

            const applyLoadedData = (data) => {
                if (data.config) setConfig(data.config);
                if (data.categories) setCategories(data.categories);
                if (data.projects) setProjects(data.projects);
            };

            const saveDataToGitHub = async (updatedConfig, updatedCats, updatedProjs) => {
                if (!accessToken || !accessToken.trim()) { 
                    throw new Error("⚠️ 未配置 GitHub Token！无法提交更改到云端。"); 
                }

                setIsSyncing(true);
                try {
                    const targetConfig = updatedConfig !== undefined ? updatedConfig : config;
                    const targetCats = updatedCats !== undefined ? updatedCats : categories;
                    const targetProjs = updatedProjs !== undefined ? updatedProjs : projects;

                    const commitData = { 
                        config: targetConfig, 
                        categories: targetCats, 
                        projects: targetProjs 
                    };
                    const base64Content = b64EncodeUnicode(JSON.stringify(commitData));
                    
                    let sha = fileSha || localStorage.getItem('github_file_sha') || '';
                    
                    try {
                        const shaRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}&t=${Date.now()}`, { 
                            headers: { 
                                'Authorization': `Bearer ${accessToken.trim()}`,
                                'Accept': 'application/vnd.github.v3+json'
                            } 
                        });
                        if (shaRes.ok) { 
                            const shaData = await shaRes.json();
                            sha = shaData.sha;
                            setFileSha(sha);
                            localStorage.setItem('github_file_sha', sha);
                        } else {
                            sha = '';
                            setFileSha('');
                            localStorage.removeItem('github_file_sha');
                        }
                    } catch(shaErr) {
                        sha = '';
                    }

                    const payload = { 
                        content: base64Content, 
                        message: `Update via PRO.FOLIO App [${new Date().toLocaleString()}]`, 
                        branch: branch
                    };
                    
                    if (sha && sha.trim() !== '') {
                        payload.sha = sha;
                    }

                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                        method: 'PUT',
                        headers: { 
                            'Content-Type': 'application/json', 
                            'Authorization': `Bearer ${accessToken.trim()}`,
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        const resData = await res.json();
                        if (resData.content && resData.content.sha) { 
                            setFileSha(resData.content.sha); 
                            localStorage.setItem('github_file_sha', resData.content.sha); 
                        }
                    } else {
                        const errBody = await res.json().catch(() => ({}));
                        if (res.status === 401) throw new Error("Token 无效或已过期，请检查 Token 字符串");
                        else if (res.status === 403) throw new Error("Token 权限不足，请确保勾选了 repo 的读写权限");
                        else if (res.status === 422) throw new Error("提交体积过大(422)，请尝试减少单次上传的图片数量或压缩图片");
                        else throw new Error(errBody.message || `GitHub 拒绝保存 (状态码: ${res.status})`);
                    }
                } catch (e) { 
                    throw e; 
                } finally { 
                    setIsSyncing(false); 
                }
            };

            const handleSetupSubmit = (e) => {
                e.preventDefault();
                const gOwner = e.target.gOwner.value.trim(); 
                const gRepo = e.target.gRepo.value.trim(); 
                const gToken = e.target.gToken.value.trim(); 
                const gBranch = e.target.gBranch?.value.trim() || 'main';
                
                localStorage.setItem('gh_portfolio_owner', gOwner); 
                localStorage.setItem('gh_portfolio_repo', gRepo);
                if (gToken) { 
                    localStorage.setItem('gh_portfolio_token', gToken); 
                    setAccessToken(gToken); 
                    setIsAdminMode(true); 
                    setShowAdminUI(true);
                }
                setOwner(gOwner);
                setRepo(gRepo);
                setBranch(gBranch);
                loadDataFromGitHub(gOwner, gRepo, gBranch, gToken);
            };

            const handleLocalFiles = async (fileList) => {
                if (!fileList || fileList.length === 0) return;
                setIsProcessingFiles(true);
                try {
                    const newImages = [...form.images];
                    for (let i = 0; i < fileList.length; i++) {
                        const file = fileList[i];
                        if (file.type.startsWith('image/')) {
                            const rawData = await readFileAsDataURL(file);
                            const compressed = await processImageSafe(rawData, 900, 0.6);
                            newImages.push(compressed);
                        }
                    }
                    setForm(prev => ({ ...prev, images: newImages }));
                    triggerToast(`已解析并压缩 ${fileList.length} 张本地图片`, "success");
                } catch (err) {
                    triggerToast(`读取图片失败: ${err.message}`, "error");
                } finally {
                    setIsProcessingFiles(false);
                }
            };

            const handleFileDrop = (e) => {
                e.preventDefault();
                setIsDragOver(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleLocalFiles(e.dataTransfer.files);
                }
            };

            const handleRemoveImageIndex = (idxToRemove) => {
                setForm(prev => ({
                    ...prev,
                    images: prev.images.filter((_, idx) => idx !== idxToRemove)
                }));
            };

            const handleUpload = async (e) => {
                e.preventDefault();
                
                if (!accessToken) {
                    triggerToast("❌ 无法保存！请先在顶部面板输入 GitHub Token 并保存凭据。", "error");
                    return;
                }

                const pastedUrls = (form.imageUrlsText || '')
                    .split('\n')
                    .map(u => u.trim())
                    .filter(Boolean);

                const allImages = [...form.images, ...pastedUrls];

                if (allImages.length === 0 && (!form.videoUrl || form.videoUrl.trim() === '')) {
                    return triggerToast('请选择本地图片、粘贴图片链接或填写视频链接', "warning");
                }
                
                setIsSyncing(true);
                const pid = editingId || `p_${Date.now()}`;
                
                try {
                    let thumb = '';
                    if (allImages.length > 0) {
                        thumb = allImages[0];
                    } else {
                        thumb = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><rect width="800" height="600" fill="%23f4f4f5"/><text x="50%25" y="50%25" font-family="sans-serif" font-weight="bold" font-size="24" fill="%23a1a1aa" text-anchor="middle" dominant-baseline="middle">动态作品准备中...</text></svg>';
                    }

                    const existingProj = projects.find(p => p.id === editingId);
                    const newProj = {
                        title: form.title,
                        description: form.description,
                        type: form.type,
                        year: form.year,
                        month: form.month,
                        videoUrl: form.videoUrl,
                        id: pid,
                        coverImage: thumb,
                        imgs: allImages,
                        isHidden: editingId ? (existingProj?.isHidden || false) : false,
                        priority: editingId ? (existingProj?.priority || Date.now()) : Date.now(),
                    };

                    let newProjectsList = editingId 
                        ? projects.map(p => p.id === editingId ? newProj : p) 
                        : [newProj, ...projects];

                    await saveDataToGitHub(config, categories, newProjectsList);
                    setProjects(newProjectsList);
                    triggerToast(editingId ? "✅ 作品已更新并写入 GitHub 云端！" : "🎉 成功发布新作品并永久写入 GitHub！", "success");

                    setForm({ title: '', description: '', type: '全部', year: new Date().getFullYear(), month: new Date().getMonth() + 1, imageUrlsText: '', images: [], videoUrl: '' });
                    setEditingId(null);
                } catch (e) {
                    triggerToast(`❌ 保存失败: ${e.message}`, "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            const toggleVisibility = async (projectId, currentHidden) => {
                if (!accessToken) return triggerToast("❌ 请先在顶部配置 GitHub Token！", "error");
                const nextProjs = projects.map(p => p.id === projectId ? { ...p, isHidden: !currentHidden } : p);
                try { 
                    await saveDataToGitHub(config, categories, nextProjs); 
                    setProjects(nextProjs); 
                    triggerToast("修改可见性成功并同步至云端", "success"); 
                } catch (e) { 
                    triggerToast(`修改失败: ${e.message}`, "error"); 
                }
            };

            const setAsTop = async (projectId) => {
                if (!accessToken) return triggerToast("❌ 请先在顶部配置 GitHub Token！", "error");
                const nextProjs = projects.map(p => p.id === projectId ? { ...p, priority: Date.now() + 1e14 } : p);
                try { 
                    await saveDataToGitHub(config, categories, nextProjs); 
                    setProjects(nextProjs); 
                    triggerToast("置顶成功并保存至云端！", "success"); 
                } catch (e) { 
                    triggerToast(`置顶失败: ${e.message}`, "error"); 
                }
            };

            const handleDeleteProject = (projectId) => {
                if (!accessToken) return triggerToast("❌ 无法删除！请先在顶部配置 GitHub Token。", "error");
                triggerConfirm('确认要永久从 GitHub 仓库中删除此作品吗？', async () => {
                    const nextProjs = projects.filter(p => p.id !== projectId);
                    try { 
                        await saveDataToGitHub(config, categories, nextProjs); 
                        setProjects(nextProjs); 
                        triggerToast("✅ 作品已永久删除并同步至 GitHub 云端", "success"); 
                    } catch (e) { 
                        triggerToast(`❌ 删除失败: ${e.message}`, "error"); 
                    }
                });
            };

            const handleStartEdit = (project) => {
                setEditingId(project.id);
                setForm({
                    title: project.title || '',
                    description: project.description || '',
                    type: project.type || '全部',
                    year: project.year || new Date().getFullYear(),
                    month: project.month || new Date().getMonth() + 1,
                    imageUrlsText: '',
                    images: (project.imgs && Array.isArray(project.imgs)) ? [...project.imgs] : [project.coverImage],
                    videoUrl: project.videoUrl || ''
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleCancelEdit = () => {
                setEditingId(null);
                setForm({ 
                    title: '', 
                    description: '', 
                    type: '全部', 
                    year: new Date().getFullYear(), 
                    month: new Date().getMonth() + 1, 
                    imageUrlsText: '', 
                    images: [],
                    videoUrl: '' 
                });
            };

            const handleHeaderUpload = async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                if (!accessToken) return triggerToast("❌ 请先在顶部配置 GitHub Token！", "error");
                
                setIsProcessingFiles(true);
                try {
                    const existingImgs = config?.header?.headerImages && config.header.headerImages.length > 0
                        ? [...config.header.headerImages]
                        : (config?.header?.headerImage ? [config.header.headerImage] : []);

                    const newImgs = [...existingImgs];
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        if (file.type.startsWith('image/')) {
                            const rawData = await readFileAsDataURL(file);
                            const safeHeader = await processImageSafe(rawData, 1200, 0.6);
                            newImgs.push(safeHeader);
                        }
                    }

                    const newConfig = { 
                        ...config, 
                        header: { 
                            ...config.header, 
                            headerImage: newImgs[0] || '',
                            headerImages: newImgs 
                        } 
                    };

                    await saveDataToGitHub(newConfig, categories, projects); 
                    setConfig(newConfig); 
                    triggerToast(`已添加 ${files.length} 张图片到主页介绍区`, "success"); 
                } catch (err) { 
                    triggerToast(`上传图片失败: ${err.message}`, "error"); 
                } finally {
                    setIsProcessingFiles(false);
                    if (e.target) e.target.value = '';
                }
            };

            const handleRemoveHeaderImage = async (idxToRemove) => {
                if (!accessToken) return triggerToast("❌ 请先配置 GitHub Token！", "error");
                const existingImgs = config?.header?.headerImages && config.header.headerImages.length > 0
                    ? [...config.header.headerImages]
                    : (config?.header?.headerImage ? [config.header.headerImage] : []);
                
                const nextImgs = existingImgs.filter((_, idx) => idx !== idxToRemove);
                const newConfig = {
                    ...config,
                    header: {
                        ...config.header,
                        headerImage: nextImgs[0] || '',
                        headerImages: nextImgs
                    }
                };

                try {
                    await saveDataToGitHub(newConfig, categories, projects);
                    setConfig(newConfig);
                    triggerToast("已移除选中介绍图", "success");
                } catch (err) {
                    triggerToast(`移除失败: ${err.message}`, "error");
                }
            };

            const handleCopyShareLink = async (days) => {
                let link = `${window.location.origin}${window.location.pathname}?owner=${owner}&repo=${repo}&branch=${branch}`;
                if (days > 0) { 
                    link += `&expire=${Date.now() + days * 24 * 60 * 60 * 1000}`; 
                }
                try {
                    await navigator.clipboard.writeText(link);
                    triggerToast(days > 0 ? `限时 ${days} 天链接已复制！` : '永久链接已复制！', 'success');
                } catch(err) {
                    triggerToast("复制分享链接失败", "error");
                }
                setShareModal(false);
            };

            const displayProjects = projects
                .filter(p => {
                    if (!isAdminMode || !showAdminUI) { 
                        if (p.isHidden) return false; 
                    }
                    const matchesCategory = activeCategory === '全部' || p.type === activeCategory;
                    const matchesYear = activeYear === '全部' || String(p.year) === String(activeYear);
                    return matchesCategory && matchesYear;
                })
                .sort((a, b) => {
                    // 1. 置顶项目优先排在最前
                    const isPinnedA = (a.priority || 0) > 1e13;
                    const isPinnedB = (b.priority || 0) > 1e13;
                    if (isPinnedA && !isPinnedB) return -1;
                    if (!isPinnedA && isPinnedB) return 1;
                    if (isPinnedA && isPinnedB) return (b.priority || 0) - (a.priority || 0);

                    // 2. 按年份从新到旧排列 (例如 2025 -> 2024 -> 2023)
                    const yearA = parseInt(a.year, 10) || 0;
                    const yearB = parseInt(b.year, 10) || 0;
                    if (yearB !== yearA) return yearB - yearA;

                    // 3. 同年份按月份从新到旧排列 (例如 12月 -> 1月)
                    const monthA = parseInt(a.month, 10) || 1;
                    const monthB = parseInt(b.month, 10) || 1;
                    if (monthB !== monthA) return monthB - monthA;

                    // 4. 最后按发布时间倒序排列
                    return (b.priority || 0) - (a.priority || 0);
                });

            const availableYears = ['全部', ...new Set(projects.map(p => p.year).filter(Boolean))].sort((a,b) => b - a);

            if (!owner || !repo) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 md:p-8">
                        <div className="w-full max-w-xl bg-white rounded-3xl p-8 md:p-12 shadow-xl border border-slate-100 text-left">
                            <div className="w-16 h-16 bg-zinc-950 rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-lg mb-8">G</div>
                            <h2 className="text-3xl font-black mb-3">连接您的 GitHub 画廊数据库</h2>
                            <p className="text-slate-400 text-xs font-semibold mb-8 uppercase tracking-wider">GitHub Portfolio Onboarding</p>
                            
                            <form onSubmit={handleSetupSubmit} className="space-y-6">
                                <div className="space-y-4">
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">步骤 1：GitHub 用户名 (Owner)</label>
                                        <input required name="gOwner" defaultValue={loginOwner} placeholder="例如：yourname" className="w-full bg-slate-50 border border-slate-100 rounded-xl px-5 py-4 outline-none text-sm text-slate-800 font-mono" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">步骤 2：公开仓库名称 (Repo)</label>
                                        <input required name="gRepo" defaultValue={loginRepo} placeholder="例如：picture" className="w-full bg-slate-50 border border-slate-100 rounded-xl px-5 py-4 outline-none text-sm text-slate-800 font-mono" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">步骤 3：默认分支 (Branch)</label>
                                        <input required name="gBranch" defaultValue={loginBranch || "main"} className="w-full bg-slate-50 border border-slate-100 rounded-xl px-5 py-4 outline-none text-sm text-slate-800 font-mono" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">步骤 4：GitHub 访问令牌 (Token - 必填项以保持同步)</label>
                                        <input name="gToken" type="password" defaultValue={loginToken} placeholder="ghp_ 开头（确保数据永久写入）" className="w-full bg-slate-50 border border-slate-100 rounded-xl px-5 py-4 outline-none text-sm text-slate-800 font-mono" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full py-5 bg-zinc-950 hover:bg-zinc-800 text-white rounded-2xl font-black text-sm uppercase shadow-lg shadow-slate-100 transition-all">绑定并开启画廊空间</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (isExpired) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 text-center">
                        <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl max-w-md w-full border border-slate-100">
                            <div className="w-14 h-14 bg-red-100 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4 font-black text-2xl">!</div>
                            <h2 className="text-2xl font-black mb-2 text-zinc-900">分享链接已过期</h2>
                            <p className="text-xs text-zinc-500 mb-6 leading-relaxed">此画廊临时访问链接已超过有效期限。请联系管理员重新获取最新的访问链接。</p>
                            {accessToken && (
                                <button onClick={() => setIsExpired(false)} className="w-full py-3 bg-zinc-950 text-white font-bold text-xs rounded-xl shadow-lg">
                                    继续以管理员身份访问
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-white font-sans selection:bg-zinc-900 selection:text-white">
                    {}
                    <nav className="fixed w-full z-50 bg-white/80 backdrop-blur-xl border-b border-zinc-100 px-4 md:px-10 h-16 md:h-20 flex items-center justify-between">
                        <div className="text-sm md:text-xl font-black tracking-tighter cursor-pointer" onClick={() => window.location.href='/'}>PORTFOLIO.LIVE</div>
                        <div className="flex items-center gap-2">
                            {isAdminMode && (
                                <button 
                                    onClick={() => setShowAdminUI(!showAdminUI)} 
                                    className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-2 ${showAdminUI ? 'bg-zinc-950 text-white shadow-xl' : 'bg-zinc-100 text-zinc-700 hover:bg-zinc-200'}`}
                                >
                                    <Icon name={showAdminUI ? "eye" : "edit-3"} size={14} />
                                    {showAdminUI ? '画廊预览模式' : '管理与创作后台'}
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* Main Workspace */}
                    <main className="pt-24 md:pt-32 pb-32 md:pb-48 px-4 md:px-10 max-w-gallery">
                        {showAdminUI && (
                            <div className="space-y-6 mb-24 animate-in slide-in-from-top-6 duration-700 text-left">
                                
                                {/* TOKEN STATUS ALERT BAR */}
                                {!accessToken ? (
                                    <div className="p-6 bg-red-950 text-white rounded-3xl border border-red-500/30 shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-red-500/20 text-red-400 rounded-2xl flex items-center justify-center shrink-0">
                                                <Icon name="alert-circle" size={20} />
                                            </div>
                                            <div>
                                                <h4 className="text-sm font-black text-red-100">⚠️ 未绑定 GitHub 写入 Token（当前所有修改刷新即消失！）</h4>
                                                <p className="text-xs text-red-200/70">必须在此填入 Token 才能把图片和修改存入云端。</p>
                                            </div>
                                        </div>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            const tok = e.target.token.value.trim();
                                            if (tok) {
                                                localStorage.setItem('gh_portfolio_token', tok);
                                                setAccessToken(tok);
                                                setIsAdminMode(true);
                                                triggerToast("🎉 GitHub Token 成功绑定！现在发布的作品将永久保存。", "success");
                                                loadDataFromGitHub(owner, repo, branch, tok);
                                            } else {
                                                triggerToast("请输入有效 Token", "warning");
                                            }
                                        }} className="flex gap-2 w-full md:w-auto">
                                            <input name="token" type="password" placeholder="粘贴 ghp_ 开头的 Token..." className="bg-white/10 text-white border border-white/20 rounded-xl px-4 py-2.5 text-xs outline-none font-mono placeholder:text-zinc-400 w-full md:w-64" />
                                            <button type="submit" className="px-5 py-2.5 bg-white text-zinc-950 hover:bg-zinc-100 rounded-xl text-xs font-black shrink-0">保存凭据</button>
                                        </form>
                                    </div>
                                ) : (
                                    <div className="p-4 bg-emerald-950/90 text-emerald-100 border border-emerald-500/30 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-3 text-xs font-bold shadow-md">
                                        <div className="flex items-center gap-2">
                                            <Icon name="check-circle" size={16} className="text-emerald-400" />
                                            <span>GitHub 云端同步就绪：Token 已绑定，所有操作将自动写入 GitHub 仓库！</span>
                                        </div>
                                        <button onClick={() => { localStorage.removeItem('gh_portfolio_token'); setAccessToken(''); triggerToast("已解绑 Token，当前进入只读状态", "info"); }} className="text-emerald-300 hover:text-white underline text-[10px] shrink-0">更换 / 解绑 Token</button>
                                    </div>
                                )}

                                <div className="p-6 md:p-10 bg-zinc-900 rounded-3xl text-white flex flex-col md:flex-row items-center justify-between gap-6 shadow-2xl">
                                    <div className="text-left">
                                        <h3 className="text-xl md:text-2xl font-black mb-1">GitHub 工作台 (画廊定制与内容发布)</h3>
                                        <p className="text-zinc-400 text-xs font-semibold uppercase tracking-wider">拖拽上传本地图片或选择云端直连，即时排版呈现。</p>
                                    </div>
                                    <button onClick={() => setShareModal(true)} className="w-full md:w-auto px-6 py-4 bg-white text-zinc-900 rounded-2xl font-black text-xs flex items-center justify-center gap-2 shadow-xl hover:scale-[1.02] active:scale-95 transition-all"><Icon name="share-2" size={14}/> 分享空间地址</button>
                                </div>
                                
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 text-left">
                                    {/* Preference Customization Panel */}
                                    <div className="p-8 bg-zinc-50 rounded-3xl border border-zinc-200 shadow-sm space-y-6">
                                        <h4 className="text-[10px] font-black uppercase text-zinc-400 flex items-center gap-2"><Icon name="layout" size={14}/> 主页偏好定制</h4>
                                        <div className="space-y-4">
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">主页主标题</label>
                                                <input value={config?.header?.title || ''} onChange={e=>{const c={...config, header:{...config.header, title:e.target.value}}; setConfig(c); }} className="w-full bg-white border border-zinc-200 rounded-xl px-5 py-3 outline-none text-xs font-black" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">主页次标题</label>
                                                <input value={config?.header?.subtitle || ''} onChange={e=>{const c={...config, header:{...config.header, subtitle:e.target.value}}; setConfig(c); }} className="w-full bg-white border border-zinc-200 rounded-xl px-5 py-3 outline-none text-xs" />
                                            </div>

                                            {/* 展示区自定义高度与显隐设置 */}
                                            <div className="pt-2 border-t border-zinc-200 space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <label className="text-[9px] font-black text-zinc-500 uppercase">显示顶部展示区 (Banner)</label>
                                                    <input 
                                                        type="checkbox" 
                                                        checked={config?.showBanner !== false} 
                                                        onChange={e=>{ const c = { ...config, showBanner: e.target.checked }; setConfig(c); }} 
                                                        className="w-4 h-4 accent-zinc-950 cursor-pointer"
                                                    />
                                                </div>
                                                
                                                {config?.showBanner !== false && (
                                                    <div className="space-y-1">
                                                        <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">顶部 Banner 高度 ({config?.bannerHeight ?? 280}px)</label>
                                                        <input 
                                                            type="range" 
                                                            min="100" 
                                                            max="600" 
                                                            step="10"
                                                            value={config?.bannerHeight ?? 280} 
                                                            onChange={e=>{ const val = parseInt(e.target.value); const c = { ...config, bannerHeight: val }; setConfig(c); }} 
                                                            className="w-full accent-zinc-950 cursor-pointer" 
                                                        />
                                                    </div>
                                                )}

                                                <div className="space-y-1">
                                                    <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">长图最大露出高度 ({config?.cardMaxHeight ?? 480}px)</label>
                                                    <input 
                                                        type="range" 
                                                        min="200" 
                                                        max="1000" 
                                                        step="20"
                                                        value={config?.cardMaxHeight ?? 480} 
                                                        onChange={e=>{ const val = parseInt(e.target.value); const c = { ...config, cardMaxHeight: val }; setConfig(c); }} 
                                                        className="w-full accent-zinc-950 cursor-pointer" 
                                                    />
                                                </div>

                                                <div className="space-y-1">
                                                    <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">主标题字号 ({config?.titleSize ?? 64}px)</label>
                                                    <input 
                                                        type="range" 
                                                        min="24" 
                                                        max="120" 
                                                        step="2"
                                                        value={config?.titleSize ?? 64} 
                                                        onChange={e=>{ const val = parseInt(e.target.value); const c = { ...config, titleSize: val }; setConfig(c); }} 
                                                        className="w-full accent-zinc-950 cursor-pointer" 
                                                    />
                                                </div>
                                            </div>

                                            <div className="space-y-1 pt-2 border-t border-zinc-200">
                                                <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">防盗水印文字内容</label>
                                                <input value={config?.watermark || ''} onChange={e=>{const c={...config, watermark:e.target.value}; setConfig(c); }} className="w-full bg-white border border-zinc-200 rounded-xl px-5 py-3 outline-none text-xs font-bold" placeholder="例如：© COPY PROTECTION" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">水印文字大小 ({config?.watermarkFontSize ?? 24}px)</label>
                                                <input type="range" min="12" max="72" value={config?.watermarkFontSize ?? 24} onChange={e=>{const val = parseInt(e.target.value); const c = { ...config, watermarkFontSize: val }; setConfig(c); }} className="w-full accent-zinc-950" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">卡片自定义圆角 ({config?.borderRadius ?? 16}px)</label>
                                                <input type="range" min="0" max="40" value={config?.borderRadius ?? 16} onChange={e=>{const val = parseInt(e.target.value); const c = { ...config, borderRadius: val }; setConfig(c); }} className="w-full accent-zinc-950" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">主页多图/个人介绍图片管理</label>
                                                <div onClick={() => headerFileInputRef.current.click()} className="w-full py-3 border-2 border-dashed border-zinc-200 rounded-xl flex items-center justify-center gap-2 text-zinc-500 text-xs font-bold cursor-pointer hover:bg-zinc-100 transition-colors">
                                                    <Icon name="upload" size={14}/> 上传介绍图 / 封面图 (支持多选)
                                                </div>
                                                <input type="file" ref={headerFileInputRef} onChange={handleHeaderUpload} multiple className="hidden" accept="image/*" />

                                                {/* Header Images Preview Grid */}
                                                {((config?.header?.headerImages && config.header.headerImages.length > 0) || config?.header?.headerImage) && (
                                                    <div className="flex gap-2 overflow-x-auto py-2 no-scrollbar">
                                                        {(config?.header?.headerImages && config.header.headerImages.length > 0 
                                                            ? config.header.headerImages 
                                                            : [config.header.headerImage]
                                                        ).map((img, idx) => (
                                                            <div key={idx} className="relative group shrink-0 w-16 h-16 rounded-xl overflow-hidden border border-zinc-200 shadow-sm">
                                                                <img src={img} className="w-full h-full object-cover" />
                                                                <button 
                                                                    type="button" 
                                                                    onClick={() => handleRemoveHeaderImage(idx)} 
                                                                    className="absolute inset-0 bg-red-600/80 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
                                                                >
                                                                    <Icon name="x" size={12} />
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {accessToken && (
                                                <div className="space-y-1 pt-2 border-t border-zinc-200">
                                                    <label className="text-[9px] font-black text-zinc-400 ml-2 uppercase">云端绑定 Token 令牌</label>
                                                    <div className="flex gap-2">
                                                        <input type="text" readOnly value={accessToken} className="flex-1 bg-white border border-zinc-200 rounded-xl px-4 py-2 outline-none text-[10px] font-mono text-zinc-400 select-all" />
                                                        <button type="button" onClick={handleCopyToken} className="px-3 py-2 bg-zinc-950 text-white hover:bg-zinc-800 rounded-xl text-[9px] font-black uppercase shrink-0">复制</button>
                                                    </div>
                                                </div>
                                            )}
                                            <button type="button" onClick={async () => {
                                                try {
                                                    await saveDataToGitHub(config, categories, projects);
                                                    triggerToast("主页偏好已存入 GitHub 云端", "success");
                                                } catch(err) {
                                                    triggerToast(`保存失败: ${err.message}`, "error");
                                                }
                                            }} className="w-full py-3 bg-zinc-900 hover:bg-zinc-800 text-white font-black text-xs rounded-xl uppercase shadow-md transition-colors">保存主页定制设置</button>
                                        </div>

                                        <div className="pt-4 border-t border-zinc-200">
                                            <h4 className="text-[10px] font-black uppercase text-zinc-400 mb-3 flex items-center gap-1"><Icon name="layers" size={12}/> 分类管理中心</h4>
                                            <div className="flex flex-wrap gap-1.5 mb-4">
                                                {categories.map(c => (
                                                    <div key={c.id} className="bg-white border border-zinc-200 rounded-full px-3 py-1.5 text-[10px] font-bold flex items-center gap-1.5 shadow-sm">
                                                        {c.label}
                                                        {c.id !== 'All' && (
                                                            <button 
                                                                type="button" 
                                                                onClick={async () => {
                                                                    if (!accessToken) return triggerToast("❌ 请先配置 GitHub Token！", "error");
                                                                    const nextCats = categories.filter(item => item.id !== c.id);
                                                                    try { 
                                                                        await saveDataToGitHub(config, nextCats, projects); 
                                                                        setCategories(nextCats); 
                                                                        triggerToast("分类标签已删除", "success"); 
                                                                    } catch (e) { 
                                                                        triggerToast(`删除失败: ${e.message}`, "error"); 
                                                                    }
                                                                }} 
                                                                className="text-zinc-300 hover:text-red-500 transition-colors"
                                                            >
                                                                <Icon name="x" size={10}/>
                                                            </button>
                                                        )}
